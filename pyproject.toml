[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sms-spam-filter"
version = "0.1.0"
description = "Precision-oriented SMS spam filter with word and character TF-IDF"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "joblib>=1.3,<2",
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
sms-spam-train = "sms_spam_filter.train:main"
sms-spam-evaluate = "sms_spam_filter.evaluate:main"
sms-spam-predict = "sms_spam_filter.predict:main"
sms-spam-smoke-data = "sms_spam_filter.data:main"
sms-spam-experiment = "sms_spam_filter.experiments:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
